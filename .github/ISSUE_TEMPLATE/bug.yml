name: Bug
description: Something does not work or gives a wrong result.
title: "[Bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe the observed behaviour (add a screenshot if useful).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Set ...
        3. Look at ...
    validations:
      required: true
  - type: textarea
    id: parameters
    attributes:
      label: Parameters used
      description: Location (lat/lon), tilt, orientation, number and power of panels, losses.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "E.g. Chrome 130 on Windows 11; Safari on iPhone 15"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Blocking: the app cannot be used or gives wrong results"
        - "Serious: works badly but there is a workaround"
        - "Minor: cosmetic or small defect"
    validations:
      required: true
