name: Compito tecnico
description: Lavoro interno (manutenzione, miglioramento tecnico) senza una richiesta diretta degli utenti.
title: "[Tecnico] "
labels: ["tipo:tecnico", "stato:da-analizzare"]
body:
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Cosa deve essere vero a lavoro finito.
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Motivo
      description: Perché serve ora e cosa succede se non lo facciamo.
    validations:
      required: true
  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione
      description: Elenco verificabile, uno per riga.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: parti
    attributes:
      label: Parti coinvolte
      description: Moduli, file, strumenti o ruoli interessati.
    validations:
      required: false
  - type: textarea
    id: rischi
    attributes:
      label: Rischi
      description: Cosa potrebbe rompersi o andare storto.
    validations:
      required: false
