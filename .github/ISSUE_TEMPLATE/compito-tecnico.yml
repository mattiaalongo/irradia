name: Technical task
description: Internal work (maintenance, technical improvement) without a direct request from users.
title: "[Technical] "
labels: ["type:technical", "status:triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the work is done.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why it is needed now and what happens if we don't do it.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable list, one per line.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: parts
    attributes:
      label: Parts involved
      description: Modules, files, tools or roles affected.
    validations:
      required: false
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: What could break or go wrong.
    validations:
      required: false
