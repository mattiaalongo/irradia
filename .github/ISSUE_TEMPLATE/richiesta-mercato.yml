name: Market request
description: A user need for the team to analyse (no technical details needed).
title: "[Market] "
# Labels: type (who opened it) and status (the Technical Leader starts from here).
labels: ["type:market", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need from the user's point of view. There is no need to say *how*
        to build it: the Technical Leader will answer with a plan.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who the user is, what they want to do, what stops them today.
      placeholder: "A homeowner with a two-pitch roof wants to compare ... but ..."
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Expected value or benefit
      description: What changes for the user (and for the project) once the problem is solved.
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      description: Used to order the work.
      options:
        - "High: blocks the use of the app or an upcoming goal"
        - "Medium: important, can wait for the next phase"
        - "Low: an improvement, when there is time"
    validations:
      required: true
  - type: textarea
    id: solved
    attributes:
      label: How to tell it is solved
      description: What the user would see or be able to do once it is done.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Examples, links, ideas, doubts.
    validations:
      required: false
